name: Gate Q dataset probe

on:
  push:
    paths:
      - '.github/workflows/gate_q_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          python -m pip install --quiet awscli

      - name: Fetch only small OpenNeuro sidecars and markers
        run: |
          mkdir -p /tmp/gateq/data
          for s in p17 p19; do
            for task in cl clcontrol; do
              base="sub-${s}/ieeg/sub-${s}_task-${task}_ieeg"
              for ext in vhdr vmrk json; do
                aws s3 cp --no-sign-request "s3://openneuro.org/ds006065/${base}.${ext}" "/tmp/gateq/data/sub-${s}_task-${task}_ieeg.${ext}"
              done
              aws s3 cp --no-sign-request "s3://openneuro.org/ds006065/sub-${s}/ieeg/sub-${s}_task-${task}_channels.tsv" "/tmp/gateq/data/sub-${s}_task-${task}_channels.tsv"
            done
            aws s3 cp --no-sign-request "s3://openneuro.org/ds006065/sub-${s}/ieeg/sub-${s}_electrodes.tsv" "/tmp/gateq/data/sub-${s}_electrodes.tsv"
          done

      - name: Fetch authors analysis code
        run: |
          mkdir -p /tmp/gateq/tss
          curl -L --fail --retry 3 -o /tmp/gateq/TSS-main.tar.gz 'https://zenodo.org/records/14735080/files/TSS-main.tar.gz?download=1'
          tar -xzf /tmp/gateq/TSS-main.tar.gz -C /tmp/gateq/tss

      - name: Build marker/code audit report
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          root = Path('/tmp/gateq')
          lines = ['# Gate Q probe report', '', 'Generated by GitHub Actions before raw-signal Gate Q.', '']
          for f in sorted((root/'data').glob('*.vmrk')):
              markers=[]
              for line in f.read_text(errors='replace').splitlines():
                  if line.startswith('Mk') and '=' in line:
                      rhs=line.split('=',1)[1]
                      parts=rhs.split(',')
                      if len(parts)>=2:
                          markers.append((parts[0].strip(),parts[1].strip()))
              c=Counter(markers)
              lines += [f'## `{f.name}`', '', f'Total markers: **{sum(c.values())}**', '', '| type | description | count |', '|---|---|---:|']
              for (typ,desc),n in c.most_common():
                  lines.append(f'| {typ} | `{desc}` | {n} |')
              lines.append('')

          code_files=[]
          for p in (root/'tss').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.m','.py','.txt','.md'}:
                  txt=p.read_text(errors='replace')
                  hits=[]
                  for pat in ['clcontrol','BrainVision','marker','stim','Stimulus','50:250','0.25','0.05']:
                      if pat.lower() in txt.lower(): hits.append(pat)
                  if hits: code_files.append((p, hits, txt))
          lines += ['# Authors-code search', '']
          for p,hits,txt in code_files:
              rel=p.relative_to(root/'tss')
              lines += [f'## `{rel}`', '', 'Matched: '+', '.join(f'`{h}`' for h in hits), '', '```text']
              shown=0
              for i,line in enumerate(txt.splitlines(),1):
                  if any(h.lower() in line.lower() for h in hits):
                      lines.append(f'{i}: {line[:240]}')
                      shown += 1
                      if shown>=40: break
              lines += ['```','']

          out=Path('docs/GATE_Q_PROBE_REPORT.md')
          out.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit probe report
        run: |
          git config user.name 'gate-q-bot'
          git config user.email 'gate-q-bot@users.noreply.github.com'
          git add docs/GATE_Q_PROBE_REPORT.md
          git commit -m 'Record Gate Q marker and author-code probe' || exit 0
          git push
